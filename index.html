<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Now Launcher</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;1,700&display=swap" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

    <style>
        :root {
            --bg: #f7f7f8;
            --text-main: #111111;
            --text-muted: #65656b;
            --border-subtle: #e9e9ec;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--text-main);
            outline-offset: 5px;
            border-radius: 2px;
        }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 12px 16px;
            background: #fff;
            transform: translateY(-160%);
            z-index: 10;
        }

        .skip-link:focus {
            transform: none;
        }

        .page {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            grid-template-columns: 29% minmax(0, 1fr);
        }

        .site-sidebar {
            min-height: 100vh;
            min-height: 100svh;
            padding: 48px clamp(28px, 5.4vw, 104px);
            border-right: 1px solid var(--border-subtle);
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: "Google Sans", system-ui, sans-serif;
            font-size: clamp(20px, 1.45vw, 26px);
            font-weight: 400;
            letter-spacing: -0.04em;
            white-space: nowrap;
        }

        .brand-now {
            color: #343434;
            font-weight: 700;
            font-style: italic;
        }

        .brand-launcher {
            color: #787878;
            font-weight: 400;
            font-style: normal;
        }

        .logo-icon {
            color: #585252;
            font-family: "Material Symbols Rounded";
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            font-size: 1em;
            font-weight: 400;
            line-height: 1;
            letter-spacing: normal;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1em;
            height: 1em;
            flex-shrink: 0;
        }

        .nav {
            margin-top: clamp(40px, 6vh, 68px);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .nav-links a,
        .nav-placeholder {
            padding: 4px 0;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .nav-links a:hover {
            color: var(--text-main);
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        .nav-links a[aria-current="page"] {
            color: var(--text-main);
            font-weight: 600;
        }

        .nav-toggle {
            display: none;
        }

        .site-copyright {
            margin-top: clamp(44px, 7vh, 80px);
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.7;
        }


        .site-sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            height: 100svh;
            align-self: start;
            overflow-y: auto;
        }

        .nav-placeholder {
            cursor: default;
        }

        .nav-icon {
            font-family: "Material Symbols Rounded";
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: normal;
            display: block;
            width: 24px;
            height: 24px;
        }

        main {
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .hero {
            width: 100%;
            max-width: 1440px;
            margin-inline: auto;
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
            align-items: center;
            gap: clamp(24px, 2.5vw, 56px);
            padding: 48px clamp(32px, 4vw, 80px);
        }

        .hero-text {
            grid-column: 2;
            grid-row: 1;
            min-width: 0;
            container-type: inline-size;
        }

        .hero-title {
            font-family: "Google Sans", system-ui, sans-serif;
            font-size: clamp(22px, 8.9cqi, 60px);
            font-weight: normal;
            font-synthesis: none;
            line-height: 1.25;
            letter-spacing: -0.025em;
            color: #333333;
            text-align: left;
            margin-bottom: 24px;
        }

        .hero-title-row {
            display: block;
            white-space: nowrap;
        }

        .hero-title-secondary {
            color: #7b7b7b;
        }

        .title-icon {
            font-family: "Material Symbols Rounded";
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 48;
            font-weight: 300;
            display: inline-block;
            font-size: 0.8em;
            line-height: 1;
            letter-spacing: normal;
            vertical-align: -0.05em;
            color: #555555;
        }

        .hero-body {
            max-width: 36ch;
            font-size: clamp(15px, 1.05vw, 18px);
            line-height: 1.75;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .play-badge-link {
            display: inline-block;
            vertical-align: top;
        }

        .play-badge {
            display: block;
            height: 44px;
            width: auto;
            max-width: 100%;
        }

        /* Size the screen to the screenshots; the bezel adds to the outer dimensions. */
        .hero-cards {
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            max-width: min(400px, 40vh);
            justify-self: center;
            container-type: inline-size;
        }

        .phone-composition {
            font-size: calc(100cqi / 46);
            position: relative;
            height: 74em;
        }

        .device-mockup {
            position: absolute;
            top: 4em;
            left: 9em;
            width: 28em;
        }

        .device-shell {
            border-radius: 3.2em;
            padding: 1em;
            background: #050509;
            box-shadow: 0 2.8em 6em rgba(15, 23, 42, 0.55);
            display: flex;
            align-items: stretch;
        }

        .device-screen {
            position: relative;
            aspect-ratio: 1344 / 2992;
            min-width: 0;
            border-radius: 2.6em;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 0 0.1em rgba(255, 255, 255, 0.15) inset;
            flex: 1;
            display: flex;
            align-items: stretch;
        }

        .device-screen img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .phone-slide--current {
            z-index: 1;
        }

        .phone-slide--next {
            z-index: 2;
            opacity: 0;
            transition: opacity 800ms ease;
        }

        .phone-slide--next.is-visible {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .phone-slide--next {
                transition: none;
            }
        }

        @media (max-width: 1199px) {
            .page {
                grid-template-columns: 24% minmax(0, 1fr);
            }

            .site-sidebar {
                padding-inline: 24px;
            }

            .brand {
                gap: 4px;
                font-size: 20px;
            }

            .hero {
                gap: 24px;
                padding-inline: 28px;
            }
        }

        @media (max-width: 900px) {
            .page {
                display: flex;
                flex-direction: column;
            }

            .site-sidebar {
                display: contents;
            }

            .sidebar-content {
                padding: 20px clamp(24px, 5vw, 40px);
                border-bottom: 1px solid var(--border-subtle);
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 12px;
            }

            .brand {
                font-size: 22px;
            }

            .nav {
                width: 100%;
                margin: 0;
            }

            .nav-links {
                padding-top: 8px;
            }

            .nav-links a {
                width: 100%;
            }

            .nav-ready .nav-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 56px;
                min-height: 44px;
                border: 0;
                background: transparent;
                color: var(--text-main);
                font: inherit;
                font-size: 14px;
                cursor: pointer;
            }

            .nav-ready .nav-links {
                display: none;
            }

            .nav-ready .nav-links.is-open {
                display: flex;
            }

            .nav-ready .nav:has(.nav-links:not(.is-open)) {
                display: none;
            }

            main {
                flex: 1;
            }

            .hero {
                grid-template-columns: minmax(0, 1fr);
                gap: 36px;
                padding: 48px clamp(24px, 6vw, 48px) 24px;
            }

            .hero-text {
                grid-column: 1;
                grid-row: 1;
                width: 100%;
                max-width: 540px;
                justify-self: center;
            }

            .hero-title {
                margin-bottom: 20px;
                text-align: center;
            }

            .hero-body {
                font-size: 16px;
                max-width: 46ch;
                margin-bottom: 24px;
            }

            .hero-cards {
                grid-row: 2;
                max-width: 340px;
                width: calc(100% - 24px);
            }

            .site-copyright {
                order: 3;
                margin: 0;
                padding: 20px 24px 28px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .sidebar-content {
                padding: 16px 24px;
            }

            .brand {
                font-size: 20px;
                gap: 4px;
            }

            .hero {
                padding-top: 40px;
                gap: 32px;
            }

            .hero-cards {
                max-width: 300px;
            }
        }

        @media (max-width: 1199px) {
            .page {
                grid-template-columns: 24% minmax(0, 1fr);
            }

            .site-sidebar {
                padding-inline: 24px;
            }

            .brand {
                gap: 4px;
                font-size: 20px;
            }
        }

        @media (max-width: 900px) {
            .page {
                display: flex;
                flex-direction: column;
            }

            .site-sidebar {
                display: contents;
            }

            .sidebar-content {
                padding: 20px clamp(24px, 5vw, 40px);
                border-bottom: 1px solid var(--border-subtle);
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 12px;
            }

            .brand {
                font-size: 22px;
            }

            .nav {
                width: 100%;
                margin: 0;
            }

            .nav-links {
                padding-top: 8px;
            }

            .nav-links a,
            .nav-placeholder {
                width: 100%;
            }

            .nav-ready .nav-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 44px;
                min-height: 44px;
                border: 0;
                background: transparent;
                color: var(--text-main);
                font: inherit;
                cursor: pointer;
            }

            .nav-ready .nav-links {
                display: none;
            }

            .nav-ready .nav-links.is-open {
                display: flex;
            }

            .nav-ready .nav:has(.nav-links:not(.is-open)) {
                display: none;
            }

            main {
                flex: 1;
            }

            .site-copyright {
                order: 3;
                margin: 0;
                padding: 20px 24px 28px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .sidebar-content {
                padding: 16px 24px;
            }

            .brand {
                font-size: 20px;
                gap: 4px;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
        <aside class="site-sidebar" aria-label="Site navigation">
            <div class="sidebar-content">
                <a class="brand" href="/" aria-label="Now Launcher home">
                    <span class="logo-icon" aria-hidden="true">bolt</span>
                    <span><span class="brand-now">Now</span> <span class="brand-launcher">Launcher</span></span>
                </a>
                <button class="nav-toggle" type="button" aria-controls="primary-links" aria-expanded="false"
                    aria-label="Open navigation"><span class="nav-icon" aria-hidden="true">menu</span></button>
                <nav class="nav" aria-label="Primary navigation">
                    <div class="nav-links" id="primary-links">
                        <a href="/" aria-current="page">Home</a>
                        <a href="/introduction">Introduction</a>
                        <a href="/features">Features</a>
                        <a href="/roadmap">Roadmap</a>
                        <a href="/privacy">Privacy</a>
                        <a href="/terms">Terms of Service</a>
                    </div>
                </nav>
            </div>
            <footer class="site-copyright">© <span id="year">2026</span> TIGERSTORM LIMITED</footer>
        </aside>

        <main id="main" tabindex="-1">
            <section class="hero" id="overview" aria-labelledby="hero-heading">
                <div class="hero-text">
                    <h1 class="hero-title" id="hero-heading"><span class="hero-title-row">The right information,</span>
                        <span class="hero-title-row hero-title-secondary">at the right time<span class="title-icon"
                                aria-hidden="true">bolt</span></span></h1>
                    <p class="hero-body">See the apps and suggestions that matter, when they’re most useful.</p>
                    <a href="https://play.google.com/store/apps/details?id=com.tigerstorm.home" class="play-badge-link">
                        <img src="/assets/play_badge.svg" alt="Get it on Google Play" class="play-badge" />
                    </a>
                </div>

                <div class="hero-cards">
                    <div class="phone-composition">
                        <div class="device-mockup">
                            <div class="device-shell">
                                <div class="device-screen" id="hero-slideshow">
                                    <img class="phone-slide--current" src="/assets/home/Screenshot_20260927-161901.png"
                                        alt="Now Launcher home screen with apps and contextual suggestions"
                                        fetchpriority="high" />
                                    <img class="phone-slide--next" alt="" aria-hidden="true" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const toggle = document.querySelector('.nav-toggle');
        const links = document.getElementById('primary-links');
        const mobile = window.matchMedia('(max-width: 900px)');
        document.documentElement.classList.add('nav-ready');

        function setNavigation(open) {
            links.classList.toggle('is-open', open);
            toggle.setAttribute('aria-expanded', String(open));
            toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
            toggle.querySelector('.nav-icon').textContent = open ? 'close' : 'menu';
        }

        toggle.addEventListener('click', () => setNavigation(toggle.getAttribute('aria-expanded') !== 'true'));
        links.addEventListener('click', event => {
            if (event.target.closest('a')) setNavigation(false);
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
                setNavigation(false);
                toggle.focus();
            }
        });
        mobile.addEventListener('change', () => {
            if (mobile.matches && links.contains(document.activeElement)) toggle.focus();
            if (!mobile.matches && document.activeElement === toggle) links.querySelector('a').focus();
            setNavigation(false);
        });
    </script>


    <script>
        (async function initialiseHeroSlideshow() {
            const screen = document.getElementById('hero-slideshow');
            const current = screen.querySelector('.phone-slide--current');
            const next = screen.querySelector('.phone-slide--next');
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            const imageDirectory = new URL('/assets/home/', window.location.origin);
            const pauseMs = 4000;
            const fadeMs = 800;
            // Add more PNG filenames here; they are loaded from /assets/home/.
            const imageFiles = [
                'Screenshot_20260927-161901.png',
                'Screenshot_20260927-173521.png',
                'Screenshot_20260927-161901.png',
                'Screenshot_20260927-173521.png',
                'Screenshot_20261004-211753.png',
                'Screenshot_20261004-212236.png',
                'Screenshot_20261004-212333.png',
                'Screenshot_20261004-212416.png',
                'Screenshot_20261004-212441.png',
                'Screenshot_20261004-212514.png', 
                'Screenshot_20261004-212538.png',
                'Screenshot_20261004-212545.png',
                'Screenshot_20261004-212709.png',
                'Screenshot_20261004-212739.png'

            ];
            const images = imageFiles.map(name => new URL(encodeURIComponent(name), imageDirectory).href);
            let queue = [];
            let lastShown = current.src;
            const failedImages = new Set();
            const wait = ms => new Promise(resolve => window.setTimeout(resolve, ms));

            function takeNextImage() {
                if (!queue.length) {
                    queue = images.filter(url => !failedImages.has(url));
                    for (let i = queue.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [queue[i], queue[j]] = [queue[j], queue[i]];
                    }
                    // Each image appears once per round; avoid a repeat between rounds.
                    if (queue.length > 1 && queue[0] === lastShown) {
                        [queue[0], queue[1]] = [queue[1], queue[0]];
                    }
                }
                return queue.shift();
            }

            function preloadImage(url) {
                return new Promise((resolve, reject) => {
                    const image = new Image();
                    const timeout = window.setTimeout(() => {
                        image.onload = image.onerror = null;
                        reject(new Error('Image loading timed out'));
                    }, 15000);
                    image.onload = () => {
                        window.clearTimeout(timeout);
                        resolve(image);
                    };
                    image.onerror = () => {
                        window.clearTimeout(timeout);
                        reject(new Error('Image could not be loaded'));
                    };
                    image.src = url;
                });
            }

            async function waitUntilVisible() {
                while (document.hidden) {
                    await new Promise(resolve => document.addEventListener('visibilitychange', resolve, { once: true }));
                }
            }

            // Respect reduced motion by keeping the first screenshot still.
            while (!reducedMotion.matches) {
                const url = takeNextImage();
                if (!url || url === lastShown) break;
                try {
                    // Only preload the next screenshot, keeping the initial page lightweight.
                    await preloadImage(url);
                    next.src = url;
                    await next.decode();
                } catch {
                    failedImages.add(url);
                    continue;
                }
                await wait(pauseMs);
                await waitUntilVisible();
                if (reducedMotion.matches) break;

                // Keep the outgoing image opaque while the incoming image fades over it.
                next.classList.add('is-visible');
                await wait(fadeMs);
                current.src = url;
                await current.decode();
                lastShown = url;
                next.style.transition = 'none';
                next.classList.remove('is-visible');
                void next.offsetWidth;
                next.style.removeProperty('transition');
            }
        })();
    </script>
