<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Features — Now Launcher</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;1,700&display=swap" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

    <style>
        :root {
            --bg: #f7f7f8;
            --text-main: #111111;
            --text-muted: #65656b;
            --border-subtle: #e9e9ec;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--text-main);
            outline-offset: 5px;
            border-radius: 2px;
        }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 12px 16px;
            background: #fff;
            transform: translateY(-160%);
            z-index: 10;
        }

        .skip-link:focus {
            transform: none;
        }

        .page {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            grid-template-columns: 29% minmax(0, 1fr);
        }

        .site-sidebar {
            min-height: 100vh;
            min-height: 100svh;
            padding: 48px clamp(28px, 5.4vw, 104px);
            border-right: 1px solid var(--border-subtle);
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: "Google Sans", system-ui, sans-serif;
            font-size: clamp(20px, 1.45vw, 26px);
            font-weight: 400;
            letter-spacing: -0.04em;
            white-space: nowrap;
        }

        .brand-now {
            color: #343434;
            font-weight: 700;
            font-style: italic;
        }

        .brand-launcher {
            color: #787878;
            font-weight: 400;
            font-style: normal;
        }

        .logo-icon {
            color: #585252;
            font-family: "Material Symbols Rounded";
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            font-size: 1em;
            font-weight: 400;
            line-height: 1;
            letter-spacing: normal;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1em;
            height: 1em;
            flex-shrink: 0;
        }

        .nav {
            margin-top: clamp(40px, 6vh, 68px);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .nav-links a,
        .nav-placeholder {
            padding: 4px 0;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .nav-links a:hover {
            color: var(--text-main);
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        .nav-links a[aria-current="page"] {
            color: var(--text-main);
            font-weight: 600;
        }

        .nav-toggle {
            display: none;
        }

        .site-copyright {
            margin-top: clamp(44px, 7vh, 80px);
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.7;
        }


        .site-sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            height: 100svh;
            align-self: start;
            overflow-y: auto;
        }

        .nav-placeholder {
            cursor: default;
        }

        .nav-icon {
            font-family: "Material Symbols Rounded";
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: normal;
            display: block;
            width: 24px;
            height: 24px;
        }

        @media (max-width: 1199px) {
            .page {
                grid-template-columns: 24% minmax(0, 1fr);
            }

            .site-sidebar {
                padding-inline: 24px;
            }

            .brand {
                gap: 4px;
                font-size: 20px;
            }
        }

        @media (max-width: 900px) {
            .page {
                display: flex;
                flex-direction: column;
            }

            .site-sidebar {
                display: contents;
            }

            .sidebar-content {
                padding: 20px clamp(24px, 5vw, 40px);
                border-bottom: 1px solid var(--border-subtle);
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 12px;
            }

            .brand {
                font-size: 22px;
            }

            .nav {
                width: 100%;
                margin: 0;
            }

            .nav-links {
                padding-top: 8px;
            }

            .nav-links a,
            .nav-placeholder {
                width: 100%;
            }

            .nav-ready .nav-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 44px;
                min-height: 44px;
                border: 0;
                background: transparent;
                color: var(--text-main);
                font: inherit;
                cursor: pointer;
            }

            .nav-ready .nav-links {
                display: none;
            }

            .nav-ready .nav-links.is-open {
                display: flex;
            }

            .nav-ready .nav:has(.nav-links:not(.is-open)) {
                display: none;
            }

            main {
                flex: 1;
            }

            .site-copyright {
                order: 3;
                margin: 0;
                padding: 20px 24px 28px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .sidebar-content {
                padding: 16px 24px;
            }

            .brand {
                font-size: 20px;
                gap: 4px;
            }
        }

        .feature-main {
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .feature-section {
            width: 100%;
            padding: 40px clamp(24px, 3vw, 56px);
        }

        .feature-shell {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
            gap: clamp(24px, 3vw, 48px);
            height: calc(100svh - 80px);
            min-height: 440px;
        }

        .feature-preview-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .feature-preview-card {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 16px;
        }

        .feature-preview-phone-shell {
            position: relative;
            width: min(300px, calc((100svh - 144px) * 0.4615), 100%);
            aspect-ratio: 9 / 19.5;
            border-radius: 2rem;
            background: #050509;
            overflow: hidden;
            box-shadow: 0 24px 40px rgba(15, 23, 42, 0.24);
            padding: 0.45rem;
        }

        .feature-preview-inner-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 1.6rem;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(148, 163, 184, 0.5);
        }

        .feature-preview-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 220ms ease, transform 220ms ease;
            pointer-events: none;
        }

        .feature-preview-image.is-active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            padding: 8px 12px 16px 4px;
            align-items: center;
            scrollbar-width: thin;
        }

        .feature-list .header-cta {
            width: 100%;
            max-width: 240px;
            display: flex;
            justify-content: center;
            padding-block: 8px;
            margin-bottom: 8px;
        }

        .play-badge-link {
            display: inline-block;
        }

        .play-badge {
            display: block;
            height: 40px;
            width: auto;
            max-width: 100%;
        }

        .feature-list-item {
            border: 0;
            background: transparent;
            padding: 0;
            margin: 0;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
            flex-shrink: 0;
            width: 100%;
            max-width: 240px;
            color: var(--text-main);
        }

        .feature-list-aspect {
            width: 100%;
            min-height: 160px;
            border-radius: 1.4rem;
            border: 1px solid #dedee2;
            padding: 18px;
            display: flex;
            align-items: center;
            transition: transform 180ms ease-out, background 180ms ease-out;
        }

        .feature-list-item:hover .feature-list-aspect {
            transform: translateY(-2px);
            background: #fff;
        }

        .feature-list-item.is-active .feature-list-aspect {
            background: #fff;
            border-color: #b8b8bf;
        }

        .feature-list-content {
            width: 100%;
        }

        .feature-list-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .feature-list-description {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .chip-background {
            display: flex;
            margin-bottom: 8px;
        }

        .chip-pro {
            background: #ededee;
            color: #333;
            padding: 3px 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        @media (max-width: 900px) {
            .feature-main {
                align-items: stretch;
            }

            .feature-section {
                padding: 24px 0 8px;
            }

            .feature-shell {
                display: flex;
                flex-direction: column;
                gap: 24px;
                height: auto;
                min-height: 0;
            }

            .feature-preview-card {
                padding: 0 24px;
            }

            .feature-preview-phone-shell {
                width: min(220px, calc((100svh - 350px) * 0.4615));
                min-width: 150px;
            }

            .feature-list {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                align-items: stretch;
                padding: 8px 24px 20px;
                scroll-padding-inline: 24px;
            }

            .feature-list .header-cta {
                flex: 0 0 160px;
                align-items: center;
                margin: 0;
            }

            .feature-list-item {
                flex: 0 0 72%;
                max-width: 250px;
                min-width: 180px;
            }

            .feature-list-aspect {
                height: 100%;
                min-height: 156px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .feature-preview-image,
            .feature-list-aspect {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
        <aside class="site-sidebar" aria-label="Site navigation">
            <div class="sidebar-content">
                <a class="brand" href="/" aria-label="Now Launcher home">
                    <span class="logo-icon" aria-hidden="true">bolt</span>
                    <span><span class="brand-now">Now</span> <span class="brand-launcher">Launcher</span></span>
                </a>
                <button class="nav-toggle" type="button" aria-controls="primary-links" aria-expanded="false"
                    aria-label="Open navigation"><span class="nav-icon" aria-hidden="true">menu</span></button>
                <nav class="nav" aria-label="Primary navigation">
                    <div class="nav-links" id="primary-links">
                        <a href="/">Home</a>
                        <a href="/introduction">Introduction</a>
                        <a href="/features" aria-current="page">Features</a>
                        <a href="/roadmap">Roadmap</a>
                        <a href="/privacy">Privacy</a>
                        <a href="/terms">Terms of Service</a>
                    </div>
                </nav>
            </div>
            <footer class="site-copyright">© <span id="year">2026</span> TIGERSTORM LIMITED</footer>
        </aside>

        <main id="main" class="feature-main" tabindex="-1">
            <section class="feature-section" aria-label="Explore Now Launcher features">
                <div class="feature-shell">
                    <!-- Centre phone preview -->
                    <div class="feature-preview-wrap">
                        <div class="feature-preview-card">
                            <div class="feature-preview-phone-shell">
                                <div class="feature-preview-inner-frame">
                                    <img src="/assets/features/home.png" alt="Smart Suggestions"
                                        class="feature-preview-image is-active" data-feature-id="smart" />
                                    <img src="/assets/features/expanded.png" alt="Focus Mode"
                                        class="feature-preview-image" data-feature-id="focus" />
                                    <img src="/assets/features/search.png" alt="Search"
                                        class="feature-preview-image" data-feature-id="search" />
                                    <img src="/assets/features/all_applications.png" alt="Applications"
                                        class="feature-preview-image" data-feature-id="apps" />
                                    <img src="/assets/features/all_applications.png" alt="Applications"
                                        class="feature-preview-image" data-feature-id="free" />
                                    <img src="/assets/features/quick_settings.png" alt="Quick Settings"
                                        class="feature-preview-image" data-feature-id="settings" />
                                    <img src="/assets/features/application_design.png" alt="Personalisation"
                                        class="feature-preview-image" data-feature-id="personalisation" />
                                    <img src="/assets/features/personalise.png" alt="Customisation"
                                        class="feature-preview-image" data-feature-id="customisation" />
                                    <img src="/assets/features/permissions.png" alt="Permissions"
                                        class="feature-preview-image" data-feature-id="permissions" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right side feature list -->
                    <aside class="feature-list" aria-label="Now Launcher features">
                        <div class="header-cta">
                            <a href="https://play.google.com/store/apps/details?id=com.tigerstorm.home"
                                class="play-badge-link">
                                <img src="/assets/play_badge.svg" alt="Get it on Google Play" class="play-badge" />
                            </a>
                        </div>

                        <button class="feature-list-item" type="button" data-feature-target="free" aria-pressed="false">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">Applications</div>
                                        <p class="feature-list-description">
                                            Access and favorite your apps right from your homescreen, all in a minimal
                                            view.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>

                        <button class="feature-list-item is-active" type="button" data-feature-target="smart"
                            aria-pressed="true">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">Smart Suggestions</div>
                                        <div class="chip-background">
                                            <div class="chip-pro">PREMIUM</div>
                                        </div>
                                        <p class="feature-list-description">
                                            See what you need, when you need it. Giving you timely, relevant actions
                                            based on today and what’s coming up next.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>



                        <button class="feature-list-item" type="button" data-feature-target="focus"
                            aria-pressed="false">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">Keep Your Focus</div>
                                        <p class="feature-list-description">
                                            Your suggestions stay minimized to keep your homescreen clear, expand them
                                            anytime when you need more.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>

                        <button class="feature-list-item" type="button" data-feature-target="search"
                            aria-pressed="false">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">Search</div>
                                        <p class="feature-list-description">
                                            Search that understands context: from apps and contacts to addresses, phone
                                            details, and instant calculations.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>


                        <button class="feature-list-item" type="button" data-feature-target="settings"
                            aria-pressed="false">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">Quick Settings</div>

                                        <p class="feature-list-description">
                                            Instant access to the settings you use most—right from your homescreen.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>

                        <button class="feature-list-item" type="button" data-feature-target="customisation"
                            aria-pressed="false">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">Customisation</div>
                                        <p class="feature-list-description">
                                            Your launcher is yours, adjust it exactly how you want.

                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>

                        <button class="feature-list-item" type="button" data-feature-target="personalisation"
                            aria-pressed="false">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">Personalisation</div>
                                        <p class="feature-list-description">

                                            Shape your experience, set your preferences to match your style.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>

                         <button class="feature-list-item" type="button" data-feature-target="apps" aria-pressed="false">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">View All Applications</div>
                                        <p class="feature-list-description">
                                            Still access all your applications from the panel.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>

                        <button class="feature-list-item" type="button" data-feature-target="permissions"
                            aria-pressed="false">
                            <div class="feature-list-aspect">
                                <div class="feature-list-content">
                                    <div>
                                        <div class="feature-list-title">Permissions</div>
                                        <p class="feature-list-description">
                                            Adjust your permissions and your security as you require.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </button>


                    </aside>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const toggle = document.querySelector('.nav-toggle');
        const links = document.getElementById('primary-links');
        const mobile = window.matchMedia('(max-width: 900px)');
        document.documentElement.classList.add('nav-ready');

        function setNavigation(open) {
            links.classList.toggle('is-open', open);
            toggle.setAttribute('aria-expanded', String(open));
            toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
            toggle.querySelector('.nav-icon').textContent = open ? 'close' : 'menu';
        }

        toggle.addEventListener('click', () => setNavigation(toggle.getAttribute('aria-expanded') !== 'true'));
        links.addEventListener('click', event => {
            if (event.target.closest('a')) setNavigation(false);
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
                setNavigation(false);
                toggle.focus();
            }
        });
        mobile.addEventListener('change', () => {
            if (mobile.matches && links.contains(document.activeElement)) toggle.focus();
            if (!mobile.matches && document.activeElement === toggle) links.querySelector('a').focus();
            setNavigation(false);
        });


        const previewImages = document.querySelectorAll(".feature-preview-image");
        const featureButtons = document.querySelectorAll(".feature-list-item");

        function setActiveFeature(targetId) {
            // Update images
            previewImages.forEach((img) => {
                if (img.dataset.featureId === targetId) {
                    img.classList.add("is-active");
                } else {
                    img.classList.remove("is-active");
                }
            });

            // Update list items and announce the selected preview
            featureButtons.forEach((btn) => {
                btn.setAttribute("aria-pressed", String(btn.dataset.featureTarget === targetId));
                if (btn.dataset.featureTarget === targetId) {
                    btn.classList.add("is-active");
                } else {
                    btn.classList.remove("is-active");
                }
            });
        }

        featureButtons.forEach((btn) => {
            btn.addEventListener("click", () => {
                const featureId = btn.dataset.featureTarget;
                setActiveFeature(featureId);
            });
        });
    </script>
</body>

</html>
